# ==============================================================================
# Nginx Security Hardening Snippet
# Autor: Rafael Soje (https://github.com/rafaelsoje)
# Uso: Inclua este arquivo no bloco 'http' ou dentro de 'server' no nginx.conf:
#      include /etc/nginx/conf.d/security-hardening.conf;
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Ocultação de Assinatura e Versão do Servidor
# ------------------------------------------------------------------------------
# Impede a enumeração de versão do Nginx em páginas de erro e cabeçalhos HTTP
server_tokens off;

# ------------------------------------------------------------------------------
# 2. Cabeçalhos de Segurança HTTP (Defesa em Profundidade)
# ------------------------------------------------------------------------------
# HSTS: Força conexões HTTPS estritas por 1 ano, incluindo subdomínios e lista preload
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Previne Clickjacking (permite framing apenas pela mesma origem)
add_header X-Frame-Options "SAMEORIGIN" always;

# Impede MIME-type sniffing no navegador
add_header X-Content-Type-Options "nosniff" always;

# Política de Referrer para evitar vazamento de parâmetros e caminhos sensíveis
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrição de permissões de hardware para o navegador
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Content Security Policy (base defensiva - customize conforme sua aplicação)
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

# ------------------------------------------------------------------------------
# 3. Proteção de Buffers contra DoS e Slowloris
# ------------------------------------------------------------------------------
client_body_buffer_size 128k;
client_max_body_size 25M;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;

client_body_timeout 12s;
client_header_timeout 12s;
keepalive_timeout 65s;
send_timeout 10s;

# ------------------------------------------------------------------------------
# 4. Bloqueio Instantâneo de Sondagens e Arquivos Ocultos
# ------------------------------------------------------------------------------
# Bloqueia qualquer tentativa de download de dotfiles (.env, .git, .aws, .ssh) com HTTP 444 (conexão encerrada sem resposta)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
    return 444;
}

# Bloqueia backups, dumps e arquivos compactados sensíveis
location ~* \.(bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op]|tar|gz|zip)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 444;
}
